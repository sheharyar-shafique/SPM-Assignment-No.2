<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · CSRBS</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><a class="brand" href="/">CSRBS</a><nav><a href="/">Home</a><a href="/register.html">Register</a></nav></header>
<main><article><h1>Welcome back</h1><p>CSRBS-8 — Student login</p>
<form id="login-form"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Log in</button></form>
<p role="status" aria-live="polite" id="message" class="feedback"></p>
<section id="signed-in" hidden><p>Signed in as <strong id="account-name"></strong>.</p><button id="logout-button" type="button">Log out</button></section>
<p>Need an account? <a href="/register.html">Register</a>.</p></article></main>
<script src="/js/login.js" defer></script></body></html>
